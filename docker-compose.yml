name: ostiary

services:
  # Postgres and Redis both persist in named volumes. Redis holds the usage
  # queue (asynq) as well as the cache, and a queued usage task lost in a
  # restart is usage never billed. `docker compose down -v` still starts
  # everything from scratch.
  postgres:
    image: postgres:16-alpine
    container_name: ostiary-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-password-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ostiary-redis
    # AOF, fsynced every second: a Redis crash loses at most the last second
    # of queued usage tasks. No maxmemory, so nothing is evicted: an eviction
    # policy would drop queued tasks along with cache entries.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis-password-change-me}", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis-password-change-me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-init:
    image: redis:7-alpine
    container_name: ostiary-redis-init
    entrypoint: ["sh", "-c"]
    command:
      - >
        redis-cli -h redis -a '${REDIS_PASSWORD:-redis-password-change-me}' --no-auth-warning
        ACL SETUSER '${REDIS_USERNAME:-ostiary}' on '>${REDIS_PASSWORD:-redis-password-change-me}'
        '~ostiary:cache:*' '~ostiary:lastused:*' '~asynq:*' '&asynq:cancel' '+@all'
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    container_name: ostiary-gateway
    build:
      context: .
      args:
        SERVICE: gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      ENV: ${ENV:-development}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN:-health-check-token-change-me}
      METRICS_TOKEN: ${METRICS_TOKEN:-metrics-token-change-me}
      SEQ_URL: ${SEQ_URL:-}
      SEQ_API_KEY: ${SEQ_API_KEY:-}
      REDIS_ADDR: redis:6379
      REDIS_USERNAME: ${REDIS_USERNAME:-ostiary}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-password-change-me}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-5000}
      LOCAL_CACHE_TTL: ${LOCAL_CACHE_TTL:-5m}
      POSTGRE_ADDR: postgres://postgres:${POSTGRES_PASSWORD:-postgres-password-change-me}@postgres:5432/ostiary?sslmode=disable
      POSTGRE_AUTO_MIGRATE: ${POSTGRE_AUTO_MIGRATE:-true}
      POSTGRE_MAX_OPEN_CONNS: ${POSTGRE_MAX_OPEN_CONNS:-75}
      POSTGRE_MAX_IDLE_CONNS: ${POSTGRE_MAX_IDLE_CONNS:-75}
      PROVIDER_MAX_IDLE_CONNS: ${PROVIDER_MAX_IDLE_CONNS:-2000}
      PROVIDER_MAX_IDLE_CONNS_PER_HOST: ${PROVIDER_MAX_IDLE_CONNS_PER_HOST:-2000}
      USAGE_WORKER_CONCURRENCY: ${USAGE_WORKER_CONCURRENCY:-10}
      USAGE_TASK_MAX_RETRY: ${USAGE_TASK_MAX_RETRY:-25}
      USAGE_DRAIN_LIMIT: ${USAGE_DRAIN_LIMIT:-1m}
      LOCAL_KMS_MASTER_KEY: ${LOCAL_KMS_MASTER_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    # Lets a base URL point at a server running on the host, as
    # http://host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--header=x-api-key: ${HEALTH_CHECK_TOKEN:-health-check-token-change-me}", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin:
    container_name: ostiary-admin
    build:
      context: .
      args:
        SERVICE: admin
    ports:
      - "${ADMIN_PORT:-8081}:8081"
    environment:
      ADMIN_LISTEN_ADDR: ":8081"
      ENV: ${ENV:-development}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN:-health-check-token-change-me}
      METRICS_TOKEN: ${METRICS_TOKEN:-metrics-token-change-me}
      SEQ_URL: ${SEQ_URL:-}
      SEQ_API_KEY: ${SEQ_API_KEY:-}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:${PANEL_PORT:-3001}}
      # "lax" if the panel and this API share a root domain, "none" if
      # they're on unrelated domains (also needs Secure, which turns on
      # automatically for "none" regardless of ENV).
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      POSTGRE_ADDR: postgres://postgres:${POSTGRES_PASSWORD:-postgres-password-change-me}@postgres:5432/ostiary?sslmode=disable
      ADMIN_POSTGRE_MAX_OPEN_CONNS: ${ADMIN_POSTGRE_MAX_OPEN_CONNS:-10}
      ADMIN_POSTGRE_MAX_IDLE_CONNS: ${ADMIN_POSTGRE_MAX_IDLE_CONNS:-5}
      REDIS_ADDR: redis:6379
      REDIS_USERNAME: ${REDIS_USERNAME:-ostiary}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-password-change-me}
      ADMIN_REDIS_POOL_SIZE: ${ADMIN_REDIS_POOL_SIZE:-10}
      LOCAL_KMS_MASTER_KEY: ${LOCAL_KMS_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET:-jwt-secret-change-me}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-48}
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--header=x-api-key: ${HEALTH_CHECK_TOKEN:-health-check-token-change-me}", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  panel:
    container_name: ostiary-panel
    image: ghcr.io/fromscratchstudiogr/ostiary-panel:1
    environment:
      # The admin API's address as the browser reaches it, not the compose
      # service name: the browser calls it directly.
      ADMIN_API_URL: ${ADMIN_API_URL:-http://localhost:${ADMIN_PORT:-8081}}
    ports:
      - "${PANEL_PORT:-3001}:3001"
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first for localhost,
      # and Next.js only listens on IPv4, so that check always fails.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/login"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
